<div id="app">
  <header class="topbar">
    <button class="plain-btn" id="homeBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Home
    </button>
    <div class="sign title-sign" id="titleSign">
      <svg class="shield" viewBox="0 0 44 48" aria-hidden="true">
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v13c0 13-9 21-19 26C12 41 3 33 3 20z" fill="#1f4e9e"/>
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v7H3z" fill="#c7362e"/>
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v13c0 13-9 21-19 26C12 41 3 33 3 20z" fill="none" stroke="#fff" stroke-width="2.4"/>
        <text x="22" y="33" text-anchor="middle" font-size="17">50</text>
      </svg>
      <div>
        <h1>United States Map Quest</h1>
        <p>Learn all 50 states</p>
      </div>
    </div>
    <div class="sign mode-sign" id="modeSign" hidden>
      <strong id="modeName">Puzzle Builder</strong>
      <span id="modeSub">Easy · All 50</span>
    </div>
    <div class="spacer"></div>
    <div class="progress" id="progress" hidden aria-live="polite">
      <svg class="shield" viewBox="0 0 44 48" aria-hidden="true">
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v13c0 13-9 21-19 26C12 41 3 33 3 20z" fill="#1f4e9e"/>
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v7H3z" fill="#c7362e"/>
        <path d="M3 7c7 1 13-1 19-5 6 4 12 6 19 5v13c0 13-9 21-19 26C12 41 3 33 3 20z" fill="none" stroke="#fff" stroke-width="2.4"/>
        <text x="22" y="33" text-anchor="middle" font-size="17" id="progNum">1</text>
      </svg>
      <small id="progText">of 10</small>
    </div>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" title="Sounds on/off" aria-label="Sounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on-only" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off-only" d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="voiceBtn" type="button" aria-pressed="true" title="Read questions aloud on/off" aria-label="Read aloud">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path class="on-only" d="M6.5 10.5h7M6.5 8h5M20 8.5c1.3 1.6 1.3 4.4 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off-only" d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main>
    <section class="home" id="home">
      <div>
        <div class="trip">
          <div class="field" role="radiogroup" aria-labelledby="levelLabel">
            <span class="field-label" id="levelLabel">Level</span>
            <div class="opts" id="levelOpts">
              <label class="opt"><input type="radio" name="level" id="level-easy" value="easy"><span>Easy</span></label>
              <label class="opt"><input type="radio" name="level" id="level-hard" value="hard"><span>Hard</span></label>
            </div>
          </div>
          <div class="field" role="radiogroup" aria-labelledby="viewLabel">
            <span class="field-label" id="viewLabel">Map</span>
            <div class="opts" id="viewOpts">
              <label class="opt"><input type="radio" name="view" id="view-tilt" value="tilt"><span>Tilted</span></label>
              <label class="opt"><input type="radio" name="view" id="view-flat" value="flat"><span>Flat</span></label>
            </div>
          </div>
          <div class="field" role="radiogroup" aria-labelledby="regionLabel">
            <span class="field-label" id="regionLabel">Region</span>
            <div class="opts" id="regionOpts"></div>
          </div>
        </div>
        <div class="map-host" id="homeMap"></div>
        <p class="home-note" id="homeNote">Tap any state to explore it, or pick a game.</p>
      </div>
      <nav class="exits" id="exits" aria-label="Games"></nav>
    </section>

    <section class="game" id="game" hidden>
      <div class="map-host" id="gameMap"></div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </section>
  </main>
</div>

<svg id="dragLayer" aria-hidden="true">
  <defs>
    <filter id="ghostShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2a3a" flood-opacity=".35"/>
    </filter>
  </defs>
</svg>
<canvas id="confetti" hidden></canvas>

<div class="modal" id="report" hidden>
  <div class="report" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="sign report-sign">
      <h2 id="reportTitle">Trip complete!</h2>
      <p id="reportSub">Name That State · Easy · All 50</p>
    </div>
    <div class="report-body">
      <div class="stars-big" id="reportStars"></div>
      <p class="report-score" id="reportScore"></p>
      <p class="report-extra" id="reportExtra"></p>
      <div class="practice" id="reportPractice"></div>
      <div class="report-actions">
        <button class="btn btn-go" id="againBtn" type="button">Play again</button>
        <button class="btn btn-plain" id="pickBtn" type="button">Choose a game</button>
      </div>
    </div>
  </div>
</div>
